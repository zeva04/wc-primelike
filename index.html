<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Prime</title>
  <!-- EL ORDEN IMPORTA Y ES AL REVÉS DE LO QUE PARECE: Tailwind va ÚLTIMO.
       Suena mal (lo normal es framework primero y overrides después), pero es el
       orden que esta UI tuvo siempre y con el que está escrita. El CDN inyectaba
       su hoja generada DESPUÉS de nuestro <style>, así que Tailwind ganaba los
       empates de especificidad, y hay código que depende de eso: el botón de
       "cómo se juega" del menú lleva `class="tip absolute …"`, y `.tip` trae un
       `position: relative`. Con Tailwind primero gana `.tip`, el botón vuelve al
       flujo y empuja el menú entero 68px hacia abajo. Verificado el 13-ago-2026
       comparando el layout contra el CDN, elemento por elemento.

       Tailwind CONGELADO: antes esto era <script src="cdn.tailwindcss.com">, o sea
       el compilador entero corriendo en el navegador — el juego no se maquetaba sin
       red y el JIT aplicaba las clases de forma asíncrona. Se regenera con
       `node tools/congelar-css.js`; tests/css.test.js falla si queda corto. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pxkit.css">
  <link rel="stylesheet" href="assets/tailwind.css">
</head>
<body class="text-slate-100 antialiased">
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
