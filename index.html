<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Prime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* Paleta oficial WC26: emblema negro/blanco/dorado + tricolor de anfitriones */
      --wc-gold: #D4AF37;
      --wc-gold-light: #F0D97D;
      --wc-gold-dark: #8B6914;
      --wc-red: #EA002A;    /* Canadá */
      --wc-green: #007A33;  /* México */
      --wc-blue: #0057B8;   /* EE.UU. */
      --wc-black: #0B0B0E;
      /* Colores del equipo elegido (los setea JS al iniciar una run) */
      --team-primary: #D4AF37;
      --team-secondary: #8B6914;
      --team-text: #0f172a;
    }
    /* ---- EL FONDO DEL MUNDIAL (sprint de UX) ----
       Negro de base con las tres manchas de los anfitriones (rojo/verde/azul)
       difuminadas hasta mezclarse. Va en una capa fija propia: así el desenfoque
       es UNA textura de pantalla y no se recalcula con cada render de una tab. */
    body { background: var(--wc-black); min-height: 100vh; }
    body::before {
      content: ""; position: fixed; inset: -25%; z-index: -2; pointer-events: none;
      background:
        radial-gradient(closest-side circle at 16% 22%, rgba(0, 87, 184, .95), transparent 100%),
        radial-gradient(closest-side circle at 82% 18%, rgba(234, 0, 42, .85), transparent 100%),
        radial-gradient(closest-side circle at 68% 82%, rgba(0, 122, 51, .95), transparent 100%),
        radial-gradient(closest-side circle at 22% 86%, rgba(234, 0, 42, .55), transparent 100%),
        radial-gradient(closest-side circle at 50% 48%, rgba(0, 87, 184, .45), transparent 100%);
      filter: blur(90px) saturate(1.25);
      opacity: .8;
    }
    /* Viñeta: el color vive en el centro y los bordes vuelven al negro. */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse 95% 85% at 50% 50%, transparent 45%, rgba(6, 6, 10, .72) 100%);
    }
    /* ---- EL HUD (sprint de UX): la barra de estado de las pantallas de gestión ----
       UN solo componente de medidor repetido —etiqueta, número, barra, pie—; que sean
       IDÉNTICOS en forma es lo que los vuelve comparables de un vistazo. Lo único que
       cambia por medidor es el color, que entra por la variable --g. */
    .hud {
      display: flex; align-items: center; flex-wrap: wrap; gap: 14px;
      padding: 9px 14px; border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(9, 11, 16, .72); backdrop-filter: blur(6px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .05);
    }
    .hud-sep { width: 1px; align-self: stretch; background: rgba(255, 255, 255, .09); }
    .hud-label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .16em; color: var(--g); opacity: .85; }
    .hud-lvl { font-size: 17px; font-weight: 900; line-height: 1.15; }
    .hud-lvl small { font-size: 12px; font-weight: 800; color: #64748b; }
    .hud-bar { height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .6); overflow: hidden; margin-top: 4px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); }
    .hud-bar > span { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; background: linear-gradient(90deg, color-mix(in srgb, var(--g) 45%, transparent), var(--g)); }
    .hud-foot { font-size: 10px; font-weight: 700; color: #64748b; margin-top: 3px; }
    /* El multiplicador como BUFF: chip corto en el color del medidor, no prosa. */
    .hud-chip {
      font-size: 10px; font-weight: 900; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px;
      color: var(--g); background: color-mix(in srgb, var(--g) 15%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--g) 34%, transparent);
    }
    /* El recurso gastable: placa dorada propia. No es un dato más, es lo que se gasta. */
    .hud-res {
      display: flex; align-items: center; gap: 9px; padding: 7px 12px; border-radius: 11px;
      border: 1px solid rgba(212, 175, 55, .34);
      background: linear-gradient(160deg, rgba(212, 175, 55, .17), rgba(212, 175, 55, .04));
    }
    .hud-btn {
      font-size: 11px; font-weight: 800; padding: 7px 11px; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .04); color: #cbd5e1;
      transition: all .14s ease;
    }
    .hud-btn:hover { border-color: rgba(255, 255, 255, .28); color: #fff; background: rgba(255, 255, 255, .09); }
    .hud-btn:disabled { cursor: not-allowed; opacity: .4; }
    /* Tooltip propio (el `title` nativo tarda 1s y no combina): data-tip + .tip */
    .tip { position: relative; }
    .tip::after {
      content: attr(data-tip);
      position: absolute; top: 50%; right: calc(100% + 10px); transform: translateY(-50%);
      white-space: nowrap; padding: 5px 9px; border-radius: 7px;
      background: rgba(8, 8, 12, .96); border: 1px solid rgba(212, 175, 55, .38);
      color: #e9e9f0; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      opacity: 0; pointer-events: none; transition: opacity .14s ease;
    }
    .tip:hover::after { opacity: 1; }
    /* Variante para tooltips en medio de una barra: cae abajo, no al costado. */
    .tip-b::after { top: calc(100% + 8px); right: auto; left: 50%; transform: translateX(-50%); }
    .btn-primary {
      padding: 0.65rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 800;
      color: #0f172a;
      background: linear-gradient(135deg, var(--wc-gold-light), var(--wc-gold));
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5); }
    .btn-primary:disabled { cursor: not-allowed; }
    /* Utilidades con los colores del equipo elegido */
    .tp-border { border-color: var(--team-primary) !important; }
    .tp-text { color: var(--team-primary) !important; }
    .tp-bg-soft { background: color-mix(in srgb, var(--team-primary) 14%, transparent) !important; }
    .tp-gradient { background: linear-gradient(135deg, var(--team-primary), var(--team-secondary)); color: var(--team-text); }
    .tp-ring { box-shadow: 0 0 0 2px color-mix(in srgb, var(--team-primary) 55%, transparent); }
    .tp-topbar { border-top: 4px solid var(--team-primary); }
    /* Barra tricolor de los anfitriones */
    .tricolor-bar {
      height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, var(--wc-red) 0%, var(--wc-red) 32%, var(--wc-green) 34%, var(--wc-green) 65%, var(--wc-blue) 67%, var(--wc-blue) 100%);
    }
    .gold-text {
      background: linear-gradient(180deg, var(--wc-gold-light), var(--wc-gold) 55%, var(--wc-gold-dark));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .flag-img { object-fit: cover; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.5); outline: 1px solid rgba(255,255,255,.18); display: inline-block; vertical-align: middle; }
    /* Césped de Gestión de Plantilla: franjas de corte + viñeta de estadio */
    .pitch {
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.055) 0 8%, transparent 8% 16%),
        linear-gradient(180deg, #1e7a3a 0%, #17632f 55%, #114d25 100%);
      box-shadow: inset 0 0 70px rgba(0,0,0,.55);
      image-rendering: pixelated;
    }
    .pitch-line { border-color: rgba(255,255,255,.28); pointer-events: none; position: absolute; }
    /* ---- Pizarra táctica (pantalla de Identidad, ui/board.js) ----
       Manuscrita SOLO en anotaciones (decisión de sprint): fuentes del sistema,
       el juego funciona offline y no se traen webfonts. */
    .tb-hand, .chalk-hand {
      font-family: "Ink Free", "Segoe Script", "Bradley Hand", "Brush Script MT", cursive;
      letter-spacing: .2px;
    }
    #tb-cam { transition: transform .5s cubic-bezier(.22,.7,.2,1); }
    .tb-node { transition: opacity .25s ease; }
    .tb-node:hover circle:nth-of-type(3) { filter: brightness(1.25); }
    .tb-node text { paint-order: stroke; }
    /* La cámara con zoom apaga el resto de la pizarra: el foco es el rasgo abierto */
    #tb-svg.tb-zoomed .tb-node:not(.tb-sel) { opacity: .3; }
    /* El post-it de lejos solo dice "Notas del DT"; su contenido aparece al hacerle zoom
       (mismo gesto que un papel garabateado: te acercas para leerlo). */
    .tb-note-body { opacity: 0; transition: opacity .28s ease .2s; }
    .tb-note-cover { opacity: 1; transition: opacity .18s ease; }
    .tb-note.tb-sel .tb-note-body { opacity: 1; }
    .tb-note.tb-sel .tb-note-cover { opacity: 0; }
    @keyframes tbpulse { 0%,100% { opacity: .18; transform: scale(1); } 50% { opacity: .6; transform: scale(1.09); } }
    .tb-pulse { animation: tbpulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    /* ---- El RIEL DEL PIZARRÓN: la ficha del rasgo (decisión PO: opción D) ----
       No es una card flotante ni otro papel: es la franja del tablero reservada
       para escribir, espejo del riel de "Los 5 principios" de la izquierda. Misma
       superficie, misma línea de tiza de separación. Entra deslizándose y SIEMPRE
       aterriza en el mismo sitio — a sangre, de alto completo. */
    .tb-rail {
      position: absolute; top: 0; right: 0; bottom: 0;
      /* UN TERCIO exacto: la pizarra abierta se lee 2 (rasgo) : 1 (sus datos), y
         camTransform() centra el nodo en los dos tercios de la izquierda con ese
         mismo número. Si este ancho cambia, hay que mover el factor de allá. */
      width: 33.3333%; min-width: 300px;
      display: flex; flex-direction: column;
      padding: 22px 22px 20px;
      border-radius: 0 20px 20px 0;
      border-left: 1px solid rgba(223, 240, 229, .16);
      background: linear-gradient(205deg, #17482f 0%, #0f3320 48%, #0a2417 100%);
      box-shadow: -26px 0 44px rgba(0, 0, 0, .5), inset 0 0 70px rgba(0, 0, 0, .35);
      transform: translateX(101%); opacity: 0; pointer-events: none;
      transition: transform .42s cubic-bezier(.22, .7, .2, 1), opacity .28s ease;
    }
    .tb-rail.open { transform: none; opacity: 1; pointer-events: auto; }
    .tb-chalkline { height: 1px; background: rgba(223, 240, 229, .18); }
    /* El CUERPO de la ficha (desc + momento + efecto) SCROLLEA: hay rasgos de tres
       efectos y el bloque de compra tiene que seguir aterrizando en el mismo píxel.
       La barra se disimula — es una pizarra, no un panel de sistema. */
    .tb-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    .tb-body::-webkit-scrollbar { width: 4px; }
    .tb-body::-webkit-scrollbar-thumb { background: rgba(223, 240, 229, .18); border-radius: 2px; }
    /* LA PLACA DEL EFECTO: lo que el rasgo hace de verdad en el partido. Se separa del
       relato con un filete del color del marcador — no es otra tiza más, es el dato. */
    .tb-fx { border-left: 2px solid var(--ink); padding: 2px 0 2px 12px; }
    /* El COLOR DEL VALOR es la leyenda que no hace falta escribir (ui/screens/philosophy
       fxKind): el marcador de la filosofía = probabilidad de que algo pase · verde =
       acierto (tuyo arriba o del rival abajo, las dos te favorecen) · ámbar = frecuencia
       en el sorteo · placa MACIZA = jugada nueva, que no es un dial sino contenido. */
    .tb-val {
      --c: var(--ink);
      display: inline-block; margin-right: 7px; padding: 1px 6px 2px;
      border-radius: 3px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      background: color-mix(in srgb, var(--c) 14%, transparent);
      color: var(--c); font-size: 14px; font-weight: 900; letter-spacing: .01em;
      white-space: nowrap; vertical-align: 1px;
    }
    /* El color solo no alcanza: el marcador del ⚡ Contragolpe ES ámbar, así que ahí
       "30%" y "×1.67" caerían del mismo tinte. Por eso el TIPO también se lee en la
       forma — la probabilidad lleva contorno (es un evento, tiene borde), el acierto y
       la frecuencia van sin él (son diales, se derraman). */
    .tb-val.is-acc, .tb-val.is-freq { border-color: transparent; background: color-mix(in srgb, var(--c) 20%, transparent); }
    .tb-val.is-acc { --c: #86efac; }
    .tb-val.is-freq { --c: #fbbf24; }
    .tb-val.is-new { background: var(--ink); border-color: var(--ink); color: #0a2417; }
    /* La LETRA CHICA: dónde/cuándo existe el rasgo. Ámbar de advertencia, y separada
       del relato por su propia línea de tiza — no compite con los efectos, los acota. */
    .tb-gate {
      border-top: 1px dashed rgba(251, 191, 36, .35); padding-top: 10px;
      display: flex; gap: 7px; align-items: flex-start;
      color: #fcd34d; font-size: 12.5px; line-height: 1.45;
    }
    /* La ETIQUETA IMANTADA: lo funcional (requisitos, compra) es un objeto sujeto
       al tablero — es lo único que puede permitirse alto contraste sobre la tiza. */
    .tb-plate {
      position: relative; border-radius: 4px; padding: 16px 14px 13px;
      border: 1px solid rgba(223, 240, 229, .16);
      background: rgba(223, 240, 229, .055);
    }
    .tb-cta {
      position: relative; width: 100%; border-radius: 4px; padding: 15px 12px 13px;
      background: var(--ink); color: #0a2417;
      font-weight: 900; font-size: 14px; letter-spacing: .03em; cursor: pointer;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .45);
      transition: transform .12s ease, filter .15s ease;
    }
    .tb-cta:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .tb-magnet {
      position: absolute; top: 6px; width: 7px; height: 7px; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #f6f8f4, #9aa79c 62%, #59665c);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .55);
    }
    @media (max-width: 700px) { .tb-rail { width: 100%; border-radius: 20px; } }
    /* ---- Mini-pizarras del selector de identidad (ui/plays.js) ----
       Cada filosofía es un pizarrón chico con su jugada firma dibujada. La no
       elegida se apaga a tiza gris; la elegida se levanta y enciende su marcador. */
    .filo-board {
      background: linear-gradient(205deg, #17482f 0%, #0f3320 48%, #0a2417 100%);
      border: 1px solid rgba(223, 240, 229, .12);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .45), inset 0 0 50px rgba(0, 0, 0, .3);
      cursor: pointer;
      transition: transform .22s cubic-bezier(.22, .7, .2, 1), border-color .2s ease, box-shadow .2s ease, opacity .25s ease;
    }
    .filo-board:hover { transform: translateY(-3px); border-color: rgba(223, 240, 229, .3); }
    /* Sin elección todavía, las cuatro conviven al mismo peso. Elegida una, las
       otras se apagan: la comparación sigue ahí, pero el foco es inequívoco.
       Se apagan con OPACITY, no con filter: un filtro CSS sobre SVG se rasteriza
       en CPU y colgaba el renderer con cuatro canchas en pantalla. */
    .filo-pick .filo-board:not(.is-sel) { opacity: .34; }
    .filo-board.is-sel {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--ink);
      box-shadow: 0 16px 34px rgba(0, 0, 0, .55), 0 0 0 1px var(--ink), inset 0 0 50px rgba(0, 0, 0, .25);
    }
    /* Las anotaciones solo existen en la elegida: reservarles hueco en las cuatro
       dejaba media pantalla vacía antes de elegir. La fila del grid crece al
       seleccionar — que es justo la lectura buscada, "la tarjeta se agranda". */
    .filo-annot { display: none; }
    .filo-board.is-sel .filo-annot { display: block; animation: fadein .3s ease; }
    /* ═══════════════════════════════════════════════════════════════════════════
       EL SISTEMA PIXEL · la Concentración Mundialista (ui/screens/hub)
       ═══════════════════════════════════════════════════════════════════════════
       Adaptación del diseño "Hub Mundial 2026" de Claude Design. Reglas del kit,
       que valen para TODO lo que lleve una clase px-:
         · bordes DUROS de 2px, nunca redondeados
         · sombras SÓLIDAS de 2-4px, jamás blur (una sombra difusa rompe el pixel)
         · todo a la grilla de 8px
         · Silkscreen SOLO en mayúsculas con tracking, y nunca para texto corrido:
           el cuerpo va en la tipografía del sistema (ver .px-body)

       La fuente va AUTO-HOSPEDADA (assets/fonts): Silkscreen es OFL y pesa 16 KB
       las dos variantes. Enlazarla a Google Fonts habría sumado una segunda
       dependencia de red en runtime — decisión PO del 6-ago-2026. */
    @font-face {
      font-family: "Silkscreen"; font-style: normal; font-weight: 400; font-display: block;
      src: url("assets/fonts/silkscreen-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Silkscreen"; font-style: normal; font-weight: 700; font-display: block;
      src: url("assets/fonts/silkscreen-700.woff2") format("woff2");
    }

    :root {
      /* Los grises MORADOS del kit. No son los slate de Tailwind: el hub vive en una
         familia propia, más cálida y más oscura, para que se lea como otra cosa. */
      --px-bg: #221f28;
      --px-panel: rgba(38, 34, 48, .86);
      --px-panel-hi: rgba(52, 46, 66, .88);
      --px-panel-lo: rgba(28, 25, 36, .86);
      --px-line: #46405a;          /* borde de panel vivo */
      --px-line-off: #332e42;      /* borde apagado / bloqueado */
      --px-ink: #f4f4f0;
      --px-dim: #a9a2b8;
      --px-faint: #5a5a66;
      --px-shadow: #05050a;
      --px-shadow-soft: #14111c;
      --px-free: #38bdf8;          /* lo que NO gasta el día */
      --px-ok: #34d399;
      --px-warn: #fbbf24;
      --px-bad: #f87171;
    }

    /* ── El LIENZO. 1440×900 exactos, escalados por JS (fitHubScreen) para llenar la
       ventana sin deformar ni hacer scroll. El pixel art solo se ve nítido si el
       lienzo tiene un tamaño real y el escalado es uniforme. ── */
    .px-stage {
      position: fixed; inset: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #14111c;
    }
    .px-screen {
      position: relative; width: 1440px; height: 900px; flex-shrink: 0;
      display: flex; flex-direction: column; overflow: hidden;
      color: var(--px-ink); image-rendering: pixelated;
      transform-origin: center center;
      background:
        radial-gradient(55% 50% at 8% 6%, rgba(234, 0, 42, .40), transparent 70%),
        radial-gradient(50% 45% at 94% 10%, rgba(0, 87, 184, .42), transparent 72%),
        radial-gradient(60% 50% at 50% 98%, rgba(0, 122, 51, .36), transparent 70%),
        var(--px-bg);
    }
    /* El CRT: barrido y viñeta. Van arriba de todo y no reciben clics. */
    .px-scan, .px-vig { position: absolute; inset: 0; pointer-events: none; }
    .px-scan { z-index: 80; background: repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px); }
    .px-vig { z-index: 81; background: radial-gradient(ellipse 82% 74% at 50% 45%, transparent 62%, rgba(0,0,0,.32) 100%); }

    /* ── Tipografía ── */
    .px { font-family: Silkscreen, "Courier New", monospace; text-transform: uppercase; letter-spacing: .08em; line-height: 1.35; }
    .px-body { font-family: ui-sans-serif, system-ui, sans-serif; letter-spacing: .01em; }

    /* ── Superficies ── */
    .px-panel { background: var(--px-panel); border: 2px solid var(--px-line); box-shadow: 3px 3px 0 var(--px-shadow); }
    .px-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--px-panel-hi); border-bottom: 2px solid var(--wc-black); }

    /* ── El BOTÓN principal, con sus 4 estados. El relieve son dos sombras internas
       (clara arriba-izquierda, oscura abajo-derecha): así se ve tallado sin un solo
       píxel difuso. Al presionar BAJA 3px y su sombra se achica — el botón se hunde. ── */
    .px-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--wc-gold); color: var(--wc-black); border: 2px solid var(--wc-black);
      box-shadow: inset 2px 2px 0 var(--wc-gold-light), inset -2px -2px 0 var(--wc-gold-dark), 4px 4px 0 var(--px-shadow);
      cursor: pointer; transition: none;
    }
    .px-btn:hover { background: var(--wc-gold-light); box-shadow: inset 2px 2px 0 #fff3c4, inset -2px -2px 0 var(--wc-gold), 4px 4px 0 var(--px-shadow); }
    .px-btn:active { background: var(--wc-gold-dark); transform: translate(3px, 3px); box-shadow: inset 2px 2px 0 var(--wc-gold), inset -2px -2px 0 #5a4409, 1px 1px 0 var(--px-shadow); }
    .px-btn:disabled, .px-btn[disabled] {
      background: #312c40; color: #79728a; border-color: var(--px-line); cursor: not-allowed; transform: none;
      box-shadow: inset 2px 2px 0 #3b3550, inset -2px -2px 0 #241f30;
    }
    /* Botón secundario: mismo relieve, sin oro — para "ver informe", "gestión de plantilla". */
    .px-btn2 {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--px-panel-hi); border: 2px solid var(--px-line); box-shadow: 2px 2px 0 var(--px-shadow);
      color: var(--px-dim); cursor: pointer;
    }
    .px-btn2:hover { border-color: var(--wc-gold); color: var(--wc-gold-light); }

    /* ── Badges. El orden de fuerza es: oro (te conviene) › celeste (es gratis) ›
       rojo (no podés) › color del equipo (ya lo elegiste). ── */
    .px-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border: 2px solid var(--wc-black); font-family: Silkscreen, monospace; font-size: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .px-tag-gold { background: var(--wc-gold); color: var(--wc-black); box-shadow: 2px 2px 0 var(--px-shadow); }
    .px-tag-free { background: #0d1b24; color: var(--px-free); border-color: var(--px-free); }
    .px-tag-off { background: var(--wc-black); color: var(--px-bad); border-color: var(--px-line); }
    .px-tag-mine { background: var(--team-primary); color: var(--team-text); box-shadow: 2px 2px 0 var(--px-shadow); }

    /* ── EL COMPLEJO. Cada edificio es un sprite con su cartel colgando debajo.
       EL HITBOX ES EL EDIFICIO, y nada más: el contenedor de la parcela NO recibe el
       puntero — solo lo hacen el sprite y el cartel. Como un <svg> hace hit-test
       sobre lo que PINTA (no sobre su caja), el área sensible acaba siendo la
       silueta del edificio.

       Antes cada edificio se apoyaba en una parcela romboidal de color que era
       bastante más grande que él: su vértice de arriba asomaba por encima del techo
       y ESE era el elemento clickeable, así que había un bloque de color reactivo
       flotando sobre cada edificio (decisión PO del 7-ago-2026: fuera). El color de
       estado se mudó al cartel, que ya lo llevaba a medias. ── */
    .px-plot { position: absolute; pointer-events: none; }
    .px-sprite { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    /* El puntero lo reciben LOS POLÍGONOS, no el <svg> ni el div que lo envuelve.
       Los dos son rectángulos del tamaño de la parcela y volverían a capturar el
       aire de alrededor — medido: con el <svg> capturando, el 83% del rectángulo
       seguía siendo sensible; con los polígonos, el 33%, que es la silueta real
       del edificio. */
    .px-sprite svg { pointer-events: none; }
    .px-sprite svg *, .px-sign { pointer-events: auto; cursor: pointer; }
    .px-plot[data-locked] .px-sprite svg *, .px-plot[data-locked] .px-sign { cursor: not-allowed; }
    .px-plot[data-off] .px-sprite svg *, .px-plot[data-off] .px-sign { cursor: default; }
    /* La sombra dura del edificio vive acá y no en el `style` del <svg> para que el
       hover pueda AÑADIRLE el contorno en vez de tener que pisarla. */
    .px-sprite svg { filter: drop-shadow(4px 6px 0 rgba(9, 20, 12, .45)); }
    .px-sign {
      position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 210px; text-align: center;
      background: rgba(18, 15, 26, .94); border: 2px solid #3a2a12; box-shadow: 2px 2px 0 var(--px-shadow);
      padding: 4px 8px; font-family: Silkscreen, monospace; font-size: 8px; letter-spacing: .06em; color: #d8d8de;
    }
    /* Hover: el edificio FLOTA, se perfila en oro y su cartel se enciende. El
       contorno son cuatro sombras duras a ±2px (drop-shadow no tiene "spread"): así
       el perfil sigue siendo pixel y no un halo difuso. */
    .px-plot:not([data-locked]):not([data-off]):not([data-inerte]):hover { z-index: 30; }
    .px-plot:not([data-locked]):not([data-off]):not([data-inerte]):hover .px-sprite { animation: pxFloat 2.4s ease-in-out infinite; }
    .px-plot:not([data-locked]):not([data-off]):not([data-inerte]):hover .px-sprite svg {
      filter: drop-shadow(4px 6px 0 rgba(9, 20, 12, .45))
        drop-shadow(2px 0 0 var(--wc-gold)) drop-shadow(-2px 0 0 var(--wc-gold))
        drop-shadow(0 2px 0 var(--wc-gold)) drop-shadow(0 -2px 0 var(--wc-gold));
    }
    .px-plot:not([data-locked]):not([data-off]):not([data-inerte]):hover .px-sign { border-color: var(--wc-gold); color: var(--wc-gold-light); }
    @keyframes pxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    /* INERTE: la parcela que no decide nada (el estacionamiento). Se ve entera —
       no está apagada ni bloqueada, simplemente no es un botón: sin levitación,
       sin contorno de oro y con el cursor de siempre. El tooltip sí funciona. */
    .px-plot[data-inerte] .px-sprite svg *, .px-plot[data-inerte] .px-sign { cursor: default; }
    /* Ya decidiste: lo que gasta el día se apaga. Lo gratis sigue encendido. */
    .px-plot[data-off] { opacity: .38; }
    /* Bloqueado ≠ apagado. Apagado es "ya elegiste otra cosa" y solo baja la opacidad;
       bloqueado es "hoy acá no se puede" y apaga el COLOR del edificio, para que el
       candado del centro se lea sobre un sitio que ya parece cerrado. */
    .px-plot[data-locked] .px-sprite svg { filter: grayscale(.75) brightness(.45); }
    .px-plot[data-locked] .px-sign { opacity: .5; }
    .px-plot[data-mine] .px-sign { border-color: var(--team-primary); color: var(--px-ink); }

    /* El TOOLTIP del edificio: sale del cartel hacia arriba, con su pico. */
    .px-tip {
      position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 12px; width: 250px;
      background: var(--px-panel-hi); border: 2px solid var(--wc-gold); box-shadow: 3px 3px 0 var(--px-shadow);
      padding: 7px 9px; z-index: 40; opacity: 0; pointer-events: none;
    }
    .px-plot:not([data-locked]):hover .px-tip, .px-plot[data-locked]:hover .px-tip { opacity: 1; }
    .px-plot[data-locked]:hover .px-tip { border-color: var(--px-bad); }
    .px-tip::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -4px; width: 8px; height: 8px; background: var(--wc-gold); }
    .px-plot[data-locked]:hover .px-tip::after { background: var(--px-bad); }
    /* VOLTEADO. Los edificios del norte están pegados al borde de arriba del
       complejo y ahí no hay sitio: el globo se salía de la franja, que RECORTA
       (`overflow:hidden`), así que el texto quedaba cortado y ningún z-index lo
       arreglaba. Volteado cae debajo del cartel, sobre el pasto, y se lee entero.
       El pico también cambia de lado: un globo que apunta al lado contrario del
       que sale se lee como si perteneciera a otra cosa. */
    .px-tip[data-abajo]::after { top: auto; bottom: 100%; }

    /* ── La LÍNEA DE DÍAS. El de hoy es más alto y parpadea en oro: la pantalla
       entera existe para resolver ESE día. ── */
    .px-day { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid; padding: 8px 6px; }
    .px-day-past { height: 60px; background: rgba(24, 21, 32, .8); border-color: var(--px-line-off); opacity: .55; }
    .px-day-next { height: 64px; background: rgba(40, 36, 52, .88); border-color: var(--px-line); box-shadow: 2px 2px 0 var(--px-shadow-soft); }
    .px-day-now { height: 80px; background: #2e2415; border-color: var(--wc-gold); box-shadow: 3px 3px 0 var(--px-shadow-soft), inset 0 0 0 2px var(--wc-gold-dark); animation: pxBlink 1.1s steps(2, end) infinite; }
    .px-day-match { height: 70px; background: #33270f; border-color: var(--px-warn); box-shadow: 3px 3px 0 var(--px-shadow-soft); }
    @keyframes pxBlink { 0%, 100% { border-color: var(--wc-gold); } 50% { border-color: var(--wc-gold-dark); } }

    /* ── El PANEL que abre un edificio (focos, pizarra). Entra sobre el mapa, no
       navega: la decisión del día se toma sin salir del complejo. ── */
    /* El panel ocupa el ANCHO DEL MAPA, no el de la pantalla: `right:396px` lo corta
       justo antes de la columna del HUD (que arranca en 1056). Tapar el estado del
       equipo mientras se elige la sesión sería esconder la mitad del criterio. */
    .px-sheet { position: absolute; left: 24px; right: 396px; top: 64px; z-index: 50; background: var(--px-panel); border: 2px solid var(--wc-gold); box-shadow: 4px 4px 0 var(--px-shadow); }
    .px-sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--px-panel-hi); border-bottom: 2px solid var(--wc-black); }
    .px-x { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--wc-black); border: 2px solid var(--px-line); font-family: Silkscreen, monospace; font-size: 10px; color: var(--px-dim); cursor: pointer; flex-shrink: 0; }
    .px-x:hover { border-color: var(--wc-gold); color: var(--wc-gold-light); }
    .px-opt { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; background: var(--px-panel-hi); border: 2px solid var(--px-line); box-shadow: 2px 2px 0 var(--px-shadow); cursor: pointer; }
    .px-opt:hover { border-color: var(--wc-gold); background: #2e2415; }

    /* ── Medidores segmentados: 16 casillas, no una barra continua. Un valor que se
       cuenta en bloques se compara de un vistazo. ── */
    .px-seg { flex: 1; height: 10px; border: 1px solid var(--px-shadow-soft); }

    /* ── La HOJA DE CONFIRMACIÓN de la Acción del Día (ui/screens/hub/confirm).
       Lo que gasta el día se mira con números antes de gastarlo: la hoja se planta
       en el medio del complejo y lo apaga con un velo, porque mientras está abierta
       no hay otra decisión posible que confirmar o cancelar. ── */
    .px-scrim { position: absolute; inset: 0; z-index: 55; background: rgba(11, 11, 14, .72); }
    .px-confirm {
      position: absolute; left: 24px; right: 396px; top: 0; bottom: 0; margin: auto;
      width: 452px; height: fit-content; z-index: 60;
      background: var(--px-panel); border: 2px solid var(--wc-gold); box-shadow: 6px 6px 0 var(--px-shadow);
    }
    /* Los cuadrados que la acción VA A MOVER: contorno en el color de su destino y
       titileo entre lleno y vacío. El contorno es lo que queda cuando el deep-link
       congela las animaciones, así que una captura sigue diciendo cuáles se mueven. */
    .px-seg-pend { box-shadow: inset 0 0 0 3px var(--seg-a); animation: pxSegPend .7s steps(2, end) infinite; }
    @keyframes pxSegPend { 0%, 100% { background: var(--seg-b); } 50% { background: var(--seg-a); } }

    /* ═══════════════════════════════════════════════════════════════════════════
       EL PARTIDO · el puente de mando (ui/screens/match)
       ═══════════════════════════════════════════════════════════════════════════
       Adaptación del diseño "Partido - Mockups v2" de Claude Design (7-ago-2026).
       Reutiliza el kit del hub —mismos colores, mismos bordes duros, misma grilla—
       y agrega solo lo que el partido tiene y la Concentración no: el marcador, el
       relato, la tarjeta de decisión y las palancas del DT.

       LA IDEA: el mando es una COLUMNA FIJA a la derecha y la decisión aterriza
       DENTRO del relato, en el mismo sitio donde se venía leyendo el minuto. No
       hay modal que tape el partido — el DT decide mirando lo que está pasando. */

    /* La franja tricolor de los anfitriones, bajo la cabecera. */
    .px-host { flex-shrink: 0; display: flex; height: 4px; }

    /* La bandera del marcador. `.flag-img` global viene redondeada y con sombra
       difusa (el resto del juego es así): acá se le quitan las dos — en el kit
       pixel un borde redondeado se ve como un error de escalado. */
    .px-flag { width: 44px; height: 30px; border: 2px solid var(--wc-black); box-shadow: 2px 2px 0 var(--px-shadow); overflow: hidden; flex-shrink: 0; }
    .px-flag .flag-img { width: 100%; height: 100%; border-radius: 0; outline: 0; box-shadow: none; display: block; }

    /* ── El RELATO. Cada línea lleva su regla de color a la izquierda: el tipo de
       evento se lee sin leer el texto. Espejo exacto de FEED_STYLE en match/index.js. ── */
    .px-line { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-left: 4px solid var(--px-bg); line-height: 1.45; }
    .px-line > b { font-family: Silkscreen, monospace; font-size: 10px; color: var(--px-faint); width: 38px; flex-shrink: 0; padding-top: 3px; font-weight: 400; }
    .px-line > span { font-size: 15px; text-wrap: pretty; color: #8f889f; }
    .px-line-goal { border-left-color: var(--px-ok); background: rgba(52, 211, 153, .15); }
    .px-line-goal > span { color: #d1fae5; font-weight: 700; }
    .px-line-goal_opp { border-left-color: var(--px-bad); background: rgba(248, 113, 113, .15); }
    .px-line-goal_opp > span { color: #fecaca; font-weight: 700; }
    .px-line-chance { border-left-color: var(--px-line-off); }
    .px-line-chance > span { color: #d4cee0; }
    .px-line-card { border-left-color: var(--px-warn); background: rgba(251, 191, 36, .10); }
    .px-line-card > span { color: #f5dfa8; }
    .px-line-event { border-left-color: #a78bfa; background: rgba(167, 139, 250, .10); }
    .px-line-event > span { color: #ddd2fb; }
    .px-line-filo { border-left-color: var(--wc-gold-light); background: rgba(212, 175, 55, .15); }
    .px-line-filo > span { color: var(--wc-gold-light); font-weight: 700; }
    .px-line-info { border-left-color: var(--wc-gold-dark); }
    .px-line-info > span { color: var(--px-warn); font-weight: 600; }

    /* ── La TARJETA DE DECISIÓN, dentro del relato. El titular parpadea en oro
       —es lo único de la pantalla que reclama el ojo— y las opciones van en
       columnas, una al lado de la otra: se comparan, no se recorren. ── */
    .px-dec { border: 2px solid var(--wc-gold); background: #2e2415; box-shadow: 3px 3px 0 var(--px-shadow); flex-shrink: 0; }
    .px-dec-head { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-bottom: 2px solid var(--wc-gold-dark); animation: pxBlink 1.1s steps(2, end) infinite; }
    .px-dec-opt {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; padding: 11px; text-align: left;
      background: var(--px-panel-hi); border: 2px solid var(--px-line); box-shadow: 3px 3px 0 var(--px-shadow); cursor: pointer;
    }
    .px-dec-opt:hover { border-color: var(--wc-gold); background: #33270f; }
    /* La tecla: A · B · C. La primera va en oro porque es la que responde el Enter. */
    .px-key { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 2px solid var(--wc-black); font-family: Silkscreen, monospace; font-size: 11px; background: var(--px-line); color: var(--px-ink); }
    .px-dec-opt:hover .px-key { background: var(--wc-gold); color: var(--wc-black); }
    /* El RIESGO: 5 casillas, no una barra. Verde ≤2 · ámbar 3 · rojo ≥4. */
    .px-risk { display: flex; gap: 2px; flex: 1; }
    .px-risk > i { flex: 1; height: 12px; border: 1px solid var(--wc-black); background: var(--px-line-off); }

    /* ── EL CENTRO DE MANDO. Es la única columna con borde de oro: lo que se toca
       vive acá y en ningún otro sitio de la pantalla. ── */
    .px-cmd { display: flex; flex-direction: column; background: var(--px-panel); border: 2px solid var(--wc-gold); box-shadow: 4px 4px 0 var(--px-shadow); }
    .px-cmd-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #2e2415; border-bottom: 2px solid var(--wc-black); }
    /* Las tres mentalidades. La elegida se talla en oro con el mismo relieve que .px-btn. */
    .px-ment { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; background: var(--px-panel-hi); border: 2px solid var(--px-line); box-shadow: 2px 2px 0 var(--px-shadow); cursor: pointer; }
    .px-ment:hover { border-color: var(--wc-gold); }
    .px-ment.is-on { background: var(--wc-gold); border-color: var(--wc-black); box-shadow: inset 2px 2px 0 var(--wc-gold-light), inset -2px -2px 0 var(--wc-gold-dark), 2px 2px 0 var(--px-shadow); }
    /* El color de la etiqueta vive acá y NO en un style inline del span: un inline le
       gana a esta regla y la mentalidad elegida quedaba con el texto gris sobre oro,
       ilegible (se vio en el navegador). */
    .px-ment > span:last-child { color: var(--px-dim); }
    .px-ment.is-on > span:last-child { color: var(--wc-black); }
    /* La ALTURA DEL BLOQUE: cinco escalones que suben. La forma ES el significado —
       repliegue a la izquierda, asfixia a la derecha— así que no lleva número. */
    .px-hbar { flex: 1; background: var(--px-line-off); border: 2px solid var(--wc-black); cursor: pointer; padding: 0; }
    .px-hbar:hover:not(:disabled) { background: var(--wc-gold-dark); }
    .px-hbar.is-on { background: var(--wc-gold); box-shadow: 2px 2px 0 var(--px-shadow); }
    .px-hbar:disabled { cursor: not-allowed; opacity: .5; }
    /* La RÁFAGA DE PRESIÓN: la barra ES el fondo del botón (ver tactics.js). */
    .px-press { position: relative; width: 100%; height: 52px; border: 2px solid var(--px-line); box-shadow: 3px 3px 0 var(--px-shadow); overflow: hidden; background: var(--px-panel-hi); padding: 0; }

    /* El SLOT DEL ASISTENTE, al pie del mando. Su consejo se queda hasta que haya
       otro: en el relato duraba tres segundos y se lo llevaba el scroll. */
    .px-at { display: flex; gap: 10px; padding: 11px; background: var(--px-panel-hi); border: 2px solid var(--px-line); box-shadow: 3px 3px 0 var(--px-shadow); }
    .px-at-ico { width: 42px; height: 42px; flex-shrink: 0; border: 2px solid var(--wc-black); box-shadow: 2px 2px 0 var(--px-shadow); background: #0d1b24; display: flex; align-items: center; justify-content: center; font-family: Silkscreen, monospace; font-size: 13px; color: var(--px-free); }

    /* La cancha MINIATURA del panel "Mi equipo". Es un croquis de la formación,
       no la pantalla de plantilla: a 180px de alto las placas con nombre y nota se
       solapan y no se lee ninguna. Se ocultan y quedan el sprite y el dorsal —
       el detalle está a un clic, en Gestión de Plantilla. ── */
    .pitch-mini [data-name] > span:last-child { display: none; }
    .pitch-mini [data-name] { z-index: 10; }

    /* ---- Sesión Táctica: los 5 principios como marcadores de tiza (hub) ----
       Trae el idioma del pizarrón a la acción que construye identidad, SIN filtros
       SVG (el hub ya renderiza mucho): tinte verde + fuente manuscrita + color por
       principio bastan. Espejo del riel izquierdo de la pizarra grande. */
    .tac-board { background: linear-gradient(160deg, rgba(23,72,47,.42), rgba(10,36,23,.5)) !important; }
    .tac-mark {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 7px 3px 6px; border-radius: 10px;
      border: 1px solid rgba(223,240,229,.1); background: rgba(2,20,12,.4);
      transition: transform .14s ease, border-color .15s ease, background .15s ease;
    }
    .tac-mark:not(:disabled) { cursor: pointer; }
    .tac-mark:not(:disabled):hover { border-color: var(--pc); background: rgba(2,20,12,.72); transform: translateY(-2px); }
    .tac-mark.is-foco { border-color: var(--pc); box-shadow: inset 0 0 0 1px var(--pc); }
    .tac-mark:disabled { opacity: .5; }
    .tac-bar { width: 100%; height: 3px; border-radius: 2px; background: rgba(0,0,0,.45); overflow: hidden; }
    .tac-bar > span { display: block; height: 100%; border-radius: 2px; }
    .board-frame {
      border-radius: 20px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
      overflow: hidden;
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-fadein { animation: fadein 0.3s ease; }
    @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .animate-pop { animation: pop 0.2s ease; }
    @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
    .animate-floaty { animation: floaty 5s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #16161c; }
    ::-webkit-scrollbar-thumb { background: #3f3f4a; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-100 antialiased">
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
